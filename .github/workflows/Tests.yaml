name: Tests

concurrency: steam

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: 0 6 * * *

jobs:
  Test:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      # Run all matrix jobs to understand whether failures are intermittent.
      fail-fast: false
      matrix:
        php:
          - 8.5
          - 8.4
        dependencies:
          - hi
          - lo

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov

      - name: Validate composer.json
        run: composer validate

      - name: Cache dependencies
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: php-${{ matrix.php }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
          restore-keys: php-${{ matrix.php }}-${{ matrix.dependencies }}-

      - name: Install dependencies ${{ matrix.dependencies == 'lo' && '(lowest)' || '' }}
        run: composer update --no-interaction --no-progress
          ${{ matrix.dependencies == 'lo' && '--prefer-lowest' || '' }}

      - name: Run test suite
        # Lowest dependencies still trigger PHP deprecation notices from
        # transitive packages. Don't fail on them here; the `hi` leg still
        # enforces failOnDeprecation from test/phpunit.xml.
        run: composer test -- --coverage-clover=build/logs/clover.xml
          ${{ matrix.dependencies == 'lo' && '--do-not-fail-on-deprecation' || '' }}
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_USER: ${{ secrets.STEAM_USER }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}

      - name: Upload test coverage
        run: |
          composer global require php-coveralls/php-coveralls:^2
          php-coveralls -v
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
